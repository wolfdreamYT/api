<div class="app">
    <main class="chat-panel" role="main" aria-label="Chat with WolfAI">
    <div class="chat-header">
        <div>
            <div class="title">Conversation</div>
            <div class="sub">WolfAI Model A</div>
        </div>
    </div>
    <div id="ai-chat" class="messages" aria-live="polite"></div>
    <div class="chat-input">
        <input id="userInput" type="text" placeholder="Type a message..." aria-label="Type a message" />
        <button id="userChat" type="button">Send</button>
    </div>
</div>
